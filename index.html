<!doctype html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#f6f7fb'><link rel='manifest' href='manifest.webmanifest'><title>Mein Stundenplan</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#16181d;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:#f6f7fb}.app{max-width:980px;margin:auto;padding:18px 16px 110px}.app::before{content:'';position:fixed;inset:0 0 auto 0;height:220px;background:linear-gradient(180deg,#eef2ff 0%,#f6f7fb 100%);z-index:-1}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 18px}.top>div:first-child{min-width:0}.topActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.top h1{font-size:30px;letter-spacing:-.8px;margin:4px 0}.sub{color:#6d7280;margin:0 0 16px}.btn{border:0;border-radius:14px;padding:12px 15px;font-weight:750;background:#16181d;color:white;min-height:44px;transition:.15s transform,.15s opacity}.btn:active{transform:scale(.97);opacity:.86}.ghost{background:rgba(255,255,255,.82);backdrop-filter:blur(16px);color:#16181d;border:1px solid rgba(226,228,233,.9)}.days{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.day{white-space:nowrap;border:0;background:white;border-radius:999px;padding:10px 14px;font-weight:650;color:#5e6470}.day.active{background:#16181d;color:white}.cards{display:none}.liveWrap{overflow:auto;-webkit-overflow-scrolling:touch;background:rgba(255,255,255,.92);border:1px solid rgba(226,228,233,.9);border-radius:24px;box-shadow:0 12px 36px rgba(38,45,65,.08);backdrop-filter:blur(20px)}.liveWrap .schedule{min-width:760px}.liveWrap .slotCourse{cursor:pointer}.liveWrap .slotCourse:active{transform:scale(.985)}.course{background:white;border-radius:18px;padding:15px;box-shadow:0 5px 22px rgba(0,0,0,.05);border-left:6px solid var(--c)}.coursehead{display:flex;justify-content:space-between;gap:12px}.course h3{margin:0 0 5px;font-size:17px}.meta{color:#666d78;font-size:14px}.empty{text-align:center;background:white;border-radius:20px;padding:35px 20px;color:#777}.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:22px;border:0;background:#16181d;color:white;font-size:32px;line-height:1;box-shadow:0 14px 30px #0004;z-index:20}.fab:active{transform:scale(.94)}dialog{border:0;border-radius:26px;width:min(94vw,470px);padding:0;box-shadow:0 30px 80px #0005;background:#fbfbfd}dialog[open]{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}dialog::backdrop{background:#0007}.modal{padding:22px}.modal h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:700;color:#5f6570}.field input,.field select{width:100%;min-height:48px;padding:13px;border:1px solid #dfe2e8;border-radius:14px;font:inherit;background:white;outline:none}.field input:focus,.field select:focus{border-color:#9aa7d8;box-shadow:0 0 0 4px #dfe5ff88}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.right{display:flex;gap:8px;margin-left:auto}.danger{background:#fff;color:#c62828;border:1px solid #f1c7c7}.small{font-size:12px;color:#8a8f99;margin-top:18px}.exportPreview{overflow:auto;border:1px solid #e2e4e9;border-radius:16px;background:white;padding:12px}.schedule{position:relative;min-width:840px;background:white;border-radius:14px;overflow:hidden}.scheduleHead{display:grid;grid-template-columns:72px repeat(5,1fr);height:54px;position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-bottom:1px solid #e8e9ed}.scheduleHead div{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:750;border-left:1px solid #eef0f3}.scheduleHead div:first-child{border-left:0;color:#8a8f99}.scheduleBody{position:relative;display:grid;grid-template-columns:72px repeat(5,1fr)}.timeCol{position:relative;border-right:1px solid #e8e9ed}.timeLabel{position:absolute;right:10px;transform:translateY(-8px);font-size:11px;color:#8a8f99}.dayCol{position:relative;border-right:1px solid #eef0f3;background:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,#f0f1f4 30px,transparent 31px,transparent 59px,#e4e6ea 60px)}.dayCol:last-child{border-right:0}.slotCourse{position:absolute;left:5px;right:5px;border-radius:11px;padding:7px 8px;background:color-mix(in srgb,var(--c) 18%,white);border-left:5px solid var(--c);overflow:hidden;box-shadow:0 2px 7px #0000000c}.slotCourse b{display:block;font-size:12px;line-height:1.2}.slotCourse span{display:block;font-size:10px;color:#626874;margin-top:3px;line-height:1.2}@media(max-width:600px){.app{padding-left:12px;padding-right:12px}.top{align-items:flex-start}.top h1{font-size:27px}.sub{font-size:14px}.topActions .btn{padding:10px 12px;font-size:13px}.liveWrap .schedule{min-width:700px}.grid{grid-template-columns:1fr}.modal{padding:18px}.actions{flex-wrap:wrap}.right{width:100%;margin-left:0}.right .btn{flex:1}}@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}}
</style></head><body><main class='app'><div class='top'><div><h1>Mein Stundenplan</h1><p class='sub'>Deine Woche auf einen Blick.</p></div><div class='topActions'><button class='btn ghost' id='exportBtn'>⇧ Teilen</button></div></div><div class='liveWrap' id='liveSchedule'></div><section class='cards' id='cards'></section></main><button class='fab' id='add' aria-label='Kurs hinzufügen' title='Kurs hinzufügen'>＋</button>
<dialog id='dlg'><form class='modal' id='form'><h2 id='formTitle'>Kurs hinzufügen</h2><input type='hidden' id='id'><div class='field'><label>Kursname</label><input id='name' required placeholder='z. B. Politische Kommunikation'></div><div class='field'><label>Raum</label><input id='room' placeholder='z. B. 23.21.02.22'></div><div class='field'><label>Wochentag</label><select id='day'></select></div><div class='grid'><div class='field'><label>Beginn</label><input id='start' type='time' step='1800' required></div><div class='field'><label>Ende</label><input id='end' type='time' step='1800' required></div></div><div class='field'><label>Farbe</label><input id='color' type='color' value='#8aa4ff'></div><div class='actions'><button type='button' class='btn danger' id='del' hidden>Löschen</button><div class='right'><button type='button' class='btn ghost' id='cancel'>Abbrechen</button><button class='btn'>Speichern</button></div></div><p class='small'>✓ Wird automatisch auf diesem Gerät gespeichert.</p></form></dialog><dialog id='exportDlg'><div class='modal'><h2>Stundenplan-Übersicht</h2><p class='sub'>Erstelle aus deinem fertigen Stundenplan eine übersichtliche Datei.</p><div class='exportPreview' id='exportPreview'></div><div class='actions'><button type='button' class='btn ghost' id='closeExport'>Schließen</button><div class='right'><button type='button' class='btn ghost' id='printExport'>PDF / Drucken</button><button type='button' class='btn' id='imageExport'>Als Bild</button></div></div></div></dialog>
<script>
const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];const KEY='stundenplan_courses_v1';let selected='Montag';let courses=JSON.parse(localStorage.getItem(KEY)||'[]');const $=x=>document.querySelector(x);const cards=$('#cards'),dlg=$('#dlg');
function save(){localStorage.setItem(KEY,JSON.stringify(courses));render()}function dayButtons(){}function render(){buildLiveSchedule()}function buildLiveSchedule(){const wrap=$('#liveSchedule');wrap.innerHTML='';if(!courses.length){wrap.innerHTML=`<div class="empty"><b>Noch keine Kurse.</b><br><br>Tippe unten auf +, um deinen ersten Kurs einzutragen.</div>`;return}const [lo,hi]=scheduleBounds(),ppm=1.45,total=(hi-lo)*ppm;const sch=document.createElement('div');sch.className='schedule';const head=document.createElement('div');head.className='scheduleHead';head.innerHTML='<div>Zeit</div>'+DAYS.map(d=>`<div>${d.slice(0,2)}</div>`).join('');sch.appendChild(head);const body=document.createElement('div');body.className='scheduleBody';body.style.height=total+'px';const tc=document.createElement('div');tc.className='timeCol';tc.style.height=total+'px';for(let m=lo;m<=hi;m+=60){let l=document.createElement('div');l.className='timeLabel';l.style.top=((m-lo)*ppm)+'px';l.textContent=fmtMin(m);tc.appendChild(l)}body.appendChild(tc);DAYS.forEach(d=>{let col=document.createElement('div');col.className='dayCol';col.style.height=total+'px';courses.filter(c=>c.day===d).sort((a,b)=>a.start.localeCompare(b.start)).forEach(c=>{let x=document.createElement('div');x.className='slotCourse';x.style.setProperty('--c',c.color);x.style.top=((timeToMin(c.start)-lo)*ppm+2)+'px';x.style.height=Math.max(34,(timeToMin(c.end)-timeToMin(c.start))*ppm-4)+'px';x.innerHTML=`<b>${esc(c.name)}</b><span>${c.start}–${c.end}${c.room?' · '+esc(c.room):''}</span>`;x.onclick=()=>openEdit(c);col.appendChild(x)});body.appendChild(col)});sch.appendChild(body);wrap.appendChild(sch)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function openNew(){form.reset();$('#id').value='';$('#formTitle').textContent='Kurs hinzufügen';$('#day').value='Montag';$('#color').value='#8aa4ff';$('#del').hidden=true;dlg.showModal()}function openEdit(c){$('#id').value=c.id;$('#name').value=c.name;$('#room').value=c.room||'';$('#day').value=c.day;$('#start').value=c.start;$('#end').value=c.end;$('#color').value=c.color||'#8aa4ff';$('#formTitle').textContent='Kurs bearbeiten';$('#del').hidden=false;dlg.showModal()}const form=$('#form');DAYS.forEach(d=>$('#day').add(new Option(d,d)));form.onsubmit=e=>{e.preventDefault();let c={id:$('#id').value||crypto.randomUUID(),name:$('#name').value.trim(),room:$('#room').value.trim(),day:$('#day').value,start:$('#start').value,end:$('#end').value,color:$('#color').value};if(c.end<=c.start){alert('Die Endzeit muss nach der Startzeit liegen.');return}let i=courses.findIndex(x=>x.id===c.id);if(i>=0)courses[i]=c;else courses.push(c);dlg.close();save()};$('#del').onclick=()=>{let id=$('#id').value;if(confirm('Diesen Kurs wirklich löschen?')){courses=courses.filter(c=>c.id!==id);dlg.close();save()}};$('#cancel').onclick=()=>dlg.close();$('#add').onclick=openNew;
function timeToMin(t){let [h,m]=t.split(':').map(Number);return h*60+m}
function scheduleBounds(){if(!courses.length)return [8*60,18*60];let lo=Math.min(...courses.map(c=>timeToMin(c.start))),hi=Math.max(...courses.map(c=>timeToMin(c.end)));lo=Math.floor((lo-30)/30)*30;hi=Math.ceil((hi+30)/30)*30;return [Math.max(0,lo),Math.min(24*60,hi)]}
function fmtMin(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function buildOverview(){const wrap=$('#exportPreview');wrap.innerHTML='';const [lo,hi]=scheduleBounds(),ppm=2,total=(hi-lo)*ppm;const sch=document.createElement('div');sch.className='schedule';const head=document.createElement('div');head.className='scheduleHead';head.innerHTML='<div>Zeit</div>'+DAYS.map(d=>`<div>${d}</div>`).join('');sch.appendChild(head);const body=document.createElement('div');body.className='scheduleBody';body.style.height=total+'px';const tc=document.createElement('div');tc.className='timeCol';tc.style.height=total+'px';for(let m=lo;m<=hi;m+=60){let l=document.createElement('div');l.className='timeLabel';l.style.top=((m-lo)*ppm)+'px';l.textContent=fmtMin(m);tc.appendChild(l)}body.appendChild(tc);DAYS.forEach(d=>{let col=document.createElement('div');col.className='dayCol';col.style.height=total+'px';courses.filter(c=>c.day===d).sort((a,b)=>a.start.localeCompare(b.start)).forEach(c=>{let x=document.createElement('div');x.className='slotCourse';x.style.setProperty('--c',c.color);x.style.top=((timeToMin(c.start)-lo)*ppm+2)+'px';x.style.height=Math.max(36,(timeToMin(c.end)-timeToMin(c.start))*ppm-4)+'px';x.innerHTML=`<b>${esc(c.name)}</b><span>${c.start}–${c.end}${c.room?' · '+esc(c.room):''}</span>`;col.appendChild(x)});body.appendChild(col)});sch.appendChild(body);wrap.appendChild(sch)}
function exportImage(){if(!courses.length){alert('Trage zuerst Kurse ein.');return}const [lo,hi]=scheduleBounds(),ppm=2,W=1500,left=105,top=130,colW=(W-left-35)/5,H=top+(hi-lo)*ppm+45,scale=2;const cv=document.createElement('canvas');cv.width=W*scale;cv.height=H*scale;const ctx=cv.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#f6f7fb';ctx.fillRect(0,0,W,H);ctx.fillStyle='#16181d';ctx.font='700 34px -apple-system, BlinkMacSystemFont, sans-serif';ctx.fillText('Mein Stundenplan',35,48);ctx.font='15px -apple-system, BlinkMacSystemFont, sans-serif';ctx.fillStyle='#6d7280';ctx.fillText('Wochenübersicht',35,76);DAYS.forEach((d,i)=>{ctx.fillStyle='#16181d';ctx.font='700 16px -apple-system, BlinkMacSystemFont, sans-serif';ctx.textAlign='center';ctx.fillText(d,left+i*colW+colW/2,112)});ctx.textAlign='left';for(let m=lo;m<=hi;m+=30){let y=top+(m-lo)*ppm;ctx.strokeStyle=m%60===0?'#dfe2e7':'#eff0f3';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(W-35,y);ctx.stroke();if(m%60===0){ctx.fillStyle='#858b96';ctx.font='12px -apple-system, BlinkMacSystemFont, sans-serif';ctx.fillText(fmtMin(m),35,y+4)}}for(let i=0;i<=5;i++){let x=left+i*colW;ctx.strokeStyle='#e5e7eb';ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,H-35);ctx.stroke()}DAYS.forEach((d,di)=>courses.filter(c=>c.day===d).forEach(c=>{let x=left+di*colW+6,y=top+(timeToMin(c.start)-lo)*ppm+4,h=Math.max(42,(timeToMin(c.end)-timeToMin(c.start))*ppm-8),w=colW-12;ctx.fillStyle=c.color+'2b';roundRect(ctx,x,y,w,h,12);ctx.fill();ctx.fillStyle=c.color;roundRect(ctx,x,y,6,h,3);ctx.fill();ctx.fillStyle='#16181d';ctx.font='700 14px -apple-system, BlinkMacSystemFont, sans-serif';ctx.fillText(c.name.slice(0,23),x+15,y+23);ctx.fillStyle='#626874';ctx.font='12px -apple-system, BlinkMacSystemFont, sans-serif';ctx.fillText(`${c.start}–${c.end}`,x+15,y+43);if(c.room&&h>60)ctx.fillText(c.room.slice(0,24),x+15,y+61)}));cv.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mein-stundenplan.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
$('#exportBtn').onclick=()=>{buildOverview();$('#exportDlg').showModal()};$('#closeExport').onclick=()=>$('#exportDlg').close();$('#imageExport').onclick=exportImage;$('#printExport').onclick=()=>{buildOverview();const html=$('#exportPreview').innerHTML;const w=window.open('','_blank');w.document.write(`<html><head><title>Mein Stundenplan</title><style>body{font-family:-apple-system,sans-serif;padding:20px}.schedule{position:relative;min-width:800px}.scheduleHead{display:grid;grid-template-columns:72px repeat(5,1fr);height:45px;border-bottom:1px solid #ddd}.scheduleHead div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}.scheduleBody{display:grid;grid-template-columns:72px repeat(5,1fr);position:relative}.timeCol,.dayCol{position:relative}.timeCol{border-right:1px solid #ddd}.timeLabel{position:absolute;right:8px;transform:translateY(-7px);font-size:10px;color:#777}.dayCol{border-right:1px solid #eee;background:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,#f2f2f2 30px,transparent 31px,transparent 59px,#ddd 60px)}.slotCourse{position:absolute;left:4px;right:4px;border-radius:8px;padding:6px;background:#f5f5f5;border-left:5px solid var(--c);overflow:hidden}.slotCourse b{display:block;font-size:11px}.slotCourse span{display:block;font-size:9px;color:#666;margin-top:2px}</style></head><body><h1>Mein Stundenplan</h1>${html}<script>setTimeout(()=>print(),300)<\/script></body></html>`);w.document.close()};
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
