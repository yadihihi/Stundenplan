<!doctype html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#f6f7fb'><link rel='manifest' href='manifest.webmanifest'><title>Mein Stundenplan</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#16181d;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:#f6f7fb}.app{max-width:920px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:28px;margin:4px 0}.sub{color:#6d7280;margin:0 0 16px}.btn{border:0;border-radius:14px;padding:12px 15px;font-weight:700;background:#16181d;color:white}.ghost{background:white;color:#16181d;border:1px solid #e2e4e9}.days{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.day{white-space:nowrap;border:0;background:white;border-radius:999px;padding:10px 14px;font-weight:650;color:#5e6470}.day.active{background:#16181d;color:white}.cards{display:grid;gap:10px;margin-top:10px}.course{background:white;border-radius:18px;padding:15px;box-shadow:0 5px 22px rgba(0,0,0,.05);border-left:6px solid var(--c)}.coursehead{display:flex;justify-content:space-between;gap:12px}.course h3{margin:0 0 5px;font-size:17px}.meta{color:#666d78;font-size:14px}.empty{text-align:center;background:white;border-radius:20px;padding:35px 20px;color:#777}.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:#16181d;color:white;font-size:30px;box-shadow:0 10px 25px #0003}dialog{border:0;border-radius:24px;width:min(92vw,470px);padding:0;box-shadow:0 30px 80px #0005}dialog::backdrop{background:#0007}.modal{padding:20px}.modal h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:700;color:#5f6570}.field input,.field select{width:100%;padding:13px;border:1px solid #dfe2e8;border-radius:12px;font:inherit;background:white}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.right{display:flex;gap:8px;margin-left:auto}.danger{background:#fff;color:#c62828;border:1px solid #f1c7c7}.small{font-size:12px;color:#8a8f99;margin-top:18px}@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}}
</style></head><body><main class='app'><div class='top'><div><h1>Mein Stundenplan</h1><p class='sub'>Deine Woche auf einen Blick.</p></div><button class='btn ghost' id='allBtn'>Alle</button></div><div class='days' id='days'></div><section class='cards' id='cards'></section></main><button class='fab' id='add' aria-label='Kurs hinzufügen'>+</button>
<dialog id='dlg'><form class='modal' id='form'><h2 id='formTitle'>Kurs hinzufügen</h2><input type='hidden' id='id'><div class='field'><label>Kursname</label><input id='name' required placeholder='z. B. Politische Kommunikation'></div><div class='field'><label>Raum</label><input id='room' placeholder='z. B. 23.21.02.22'></div><div class='field'><label>Wochentag</label><select id='day'></select></div><div class='grid'><div class='field'><label>Beginn</label><input id='start' type='time' step='1800' required></div><div class='field'><label>Ende</label><input id='end' type='time' step='1800' required></div></div><div class='field'><label>Farbe</label><input id='color' type='color' value='#8aa4ff'></div><div class='actions'><button type='button' class='btn danger' id='del' hidden>Löschen</button><div class='right'><button type='button' class='btn ghost' id='cancel'>Abbrechen</button><button class='btn'>Speichern</button></div></div><p class='small'>Die Kurse werden auf diesem Gerät gespeichert.</p></form></dialog>
<script>
const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];const KEY='stundenplan_courses_v1';let selected='Montag';let courses=JSON.parse(localStorage.getItem(KEY)||'[]');const $=x=>document.querySelector(x);const days=$('#days'),cards=$('#cards'),dlg=$('#dlg');
function save(){localStorage.setItem(KEY,JSON.stringify(courses));render()}function dayButtons(){days.innerHTML='';DAYS.forEach(d=>{let b=document.createElement('button');b.className='day'+(selected===d?' active':'');b.textContent=d;b.onclick=()=>{selected=d;dayButtons();render()};days.appendChild(b)})}function render(){let list=courses.filter(c=>selected==='Alle'||c.day===selected).sort((a,b)=>DAYS.indexOf(a.day)-DAYS.indexOf(b.day)||a.start.localeCompare(b.start));cards.innerHTML='';if(!list.length){cards.innerHTML=`<div class="empty"><b>Noch keine Kurse${selected==='Alle'?'.':' am '+selected+'.'}</b><br><br>Tippe auf +, um deinen ersten Kurs einzutragen.</div>`;return}list.forEach(c=>{let el=document.createElement('article');el.className='course';el.style.setProperty('--c',c.color);el.innerHTML=`<div class="coursehead"><div><h3>${esc(c.name)}</h3><div class="meta">${selected==='Alle'?esc(c.day)+' · ':''}${c.start}–${c.end}${c.room?' · 📍 '+esc(c.room):''}</div></div><span>›</span></div>`;el.onclick=()=>openEdit(c);cards.appendChild(el)})}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function openNew(){form.reset();$('#id').value='';$('#formTitle').textContent='Kurs hinzufügen';$('#day').value=selected==='Alle'?'Montag':selected;$('#color').value='#8aa4ff';$('#del').hidden=true;dlg.showModal()}function openEdit(c){$('#id').value=c.id;$('#name').value=c.name;$('#room').value=c.room||'';$('#day').value=c.day;$('#start').value=c.start;$('#end').value=c.end;$('#color').value=c.color||'#8aa4ff';$('#formTitle').textContent='Kurs bearbeiten';$('#del').hidden=false;dlg.showModal()}const form=$('#form');DAYS.forEach(d=>$('#day').add(new Option(d,d)));form.onsubmit=e=>{e.preventDefault();let c={id:$('#id').value||crypto.randomUUID(),name:$('#name').value.trim(),room:$('#room').value.trim(),day:$('#day').value,start:$('#start').value,end:$('#end').value,color:$('#color').value};if(c.end<=c.start){alert('Die Endzeit muss nach der Startzeit liegen.');return}let i=courses.findIndex(x=>x.id===c.id);if(i>=0)courses[i]=c;else courses.push(c);selected=c.day;dlg.close();dayButtons();save()};$('#del').onclick=()=>{let id=$('#id').value;if(confirm('Diesen Kurs wirklich löschen?')){courses=courses.filter(c=>c.id!==id);dlg.close();save()}};$('#cancel').onclick=()=>dlg.close();$('#add').onclick=openNew;$('#allBtn').onclick=()=>{selected='Alle';dayButtons();render()};dayButtons();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
