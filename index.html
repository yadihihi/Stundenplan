function save(){localStorage.setItem(KEY,JSON.stringify(courses));render()}function dayButtons(){}function render(){buildLiveSchedule()}function buildLiveSchedule(){const wrap=$('#liveSchedule');wrap.innerHTML='';if(!courses.length){wrap.innerHTML=`<div class="empty"><b>Noch keine Kurse.</b><br><br>Tippe unten auf +, um deinen ersten Kurs einzutragen.</div>`;return}const [lo,hi]=scheduleBounds(),ppm=1.45,total=(hi-lo)*ppm;const sch=document.createElement('div');sch.className='schedule';const head=document.createElement('div');head.className='scheduleHead';head.innerHTML='<div>Zeit</div>'+DAYS.map(d=>`<div>${d.slice(0,2)}</div>`).join('');sch.appendChild(head);const body=document.createElement('div');body.className='scheduleBody';body.style.height=total+'px';const tc=document.createElement('div');tc.className='timeCol';tc.style.height=total+'px';for(let m=lo;m<=hi;m+=60){let l=document.createElement('div');l.className='timeLabel';l.style.top=((m-lo)*ppm)+'px';l.textContent=fmtMin(m);tc.appendChild(l)}body.appendChild(tc);DAYS.forEach(d=>{let col=document.createElement('div');col.className='dayCol';col.style.height=total+'px';courses.filter(c=>c.day===d).sort((a,b)=>a.start.localeCompare(b.start)).forEach(c=>{let x=document.createElement('div');x.className='slotCourse';x.style.setProperty('--c',c.color);x.style.top=((timeToMin(c.start)-lo)*ppm+2)+'px';x.style.height=Math.max(34,(timeToMin(c.end)-timeToMin(c.start))*ppm-4)+'px';x.innerHTML=`<b>${esc(c.name)}</b><span>${c.start}–${c.end}${c.room?' · '+esc(c.room):''}</span>`;x.onclick=()=>openEdit(c);col.appendChild(x)});body.appendChild(col)});sch.appendChild(body);wrap.appendChild(sch)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function openNew(){form.reset();$('#id').value='';$('#formTitle').textContent='Kurs hinzufügen';$('#day').value='Montag';$('#color').value='#8aa4ff';$('#del').hidden=true;dlg.showModal()}function openEdit(c){$('#id') function timeToMin(t){let [h,m]=t.split(':').map(Number);return h*60+m}

enplan.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')}

const TASKKEY='uni_planner_tasks_v1';let tasks=JSON.parse(localStorage.getItem(TASKKEY)||'[]');let currentView='today',taskFilter='open';
function saveTasks(){localStorage.setItem(TASKKEY,JSON.stringify(tasks));renderPlanner()}
function localToday(){let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function taskStamp(t){return new Date(t.date+'T'+(t.time||'23:59')+':00').getTime()}
function dayDiff(t){let a=new Date(localToday()+'T00:00:00'),b=new Date(t.date+'T00:00:00');return Math.round((b-a)/86400000)}
function dueText(t){let d=dayDiff(t);if(d<0)return 'Überfällig';if(d===0)return 'HEUTE';if(d===1)return 'Morgen';if(d<7)return 'Noch '+d+' Tage';return new Date(t.date+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'short'})}
function dueClass(t){let d=dayDiff(t);return d<=0?'urgent':d<=3?'soon':''}
function taskHTML(t){return `<div class="task ${t.done?'done':''}" data-id="${t.id}"><button class="check" data-check="${t.id}">${t.done?'✓':''}</button><div class="taskMain"><div class="taskTitle">${esc(t.name)}</div><div class="taskMeta"><span class="subjectDot" style="background:${subjectColor(t.subject)}"></span>${esc(t.subject)} · ${esc(t.type)}${t.time?' · '+t.time:''}${t.note?' · '+esc(t.note):''}</div></div><span class="badge ${dueClass(t)}">${dueText(t)}</span><button class="iconBtn" data-edit="${t.id}">•••</button></div>`}
function subjectColor(s){let cols=['#8aa4ff','#e68aa6','#82c6a5','#d6a05e','#a68ad8','#6db8c7'];let n=0;for(let c of s)n=(n+c.charCodeAt(0))%cols.length;return cols[n]}
function renderPlanner(){let open=tasks.filter(t=>!t.done).sort((a,b)=>taskStamp(a)-taskStamp(b));let next=open[0];$('#nextDeadline').textContent=next?`${next.name} · ${dueText(next)}`:'Keine Deadline 🎉';$('#nextMeta').textContent=next?`${next.subject} · ${next.type}${next.time?' · '+next.time:''}`:'Du hast aktuell nichts Offenes.';$('#upcoming').innerHTML=open.slice(0,5).map(taskHTML).join('')||'<div class="emptyMini">Keine offenen Aufgaben. ✨</div>';let list=tasks.slice().sort((a,b)=>Number(a.done)-Number(b.done)||taskStamp(a)-taskStamp(b));if(taskFilter==='open')list=list.filter(t=>!t.done);else if(taskFilter!=='all')list=list.filter(t=>t.type===taskFilter);$('#taskList').innerHTML=list.map(taskHTML).join('')||'<div class="emptyMini">Hier ist noch nichts eingetragen.</div>';let subjects=[...new Set(courses.map(c=>c.name).concat(tasks.map(t=>t.subject)).filter(Boolean))];$('#subjectList').innerHTML=subjects.map(x=>`<option value="${esc(x)}">`).join('')}
function openTask(t){$('#taskForm').reset();$('#taskId').value=t?.id||'';$('#taskFormTitle').textContent=t?'Eintrag bearbeiten':'Neue Deadline';$('#taskName').value=t?.name||'';$('#taskSubject').value=t?.subject||'';$('#taskDate').value=t?.date||localToday();$('#taskTime').value=t?.time||'';$('#taskNote').value=t?.note||'';document.querySelector(`input[name=taskType][value="${t?.type||'Hausaufgabe'}"]`).checked=true;$('#taskDel').hidden=!t;$('#taskDlg').showModal()}
$('#taskForm').onsubmit=e=>{e.preventDefault();let id=$('#taskId').value||crypto.randomUUID(),old=tasks.find(x=>x.id===id);let t={id,name:$('#taskName').value.trim(),subject:$('#taskSubject').value.trim(),type:document.querySelector('input[name=taskType]:checked').value,date:$('#taskDate').value,time:$('#taskTime').value,note:$('#taskNote').value.trim(),done:old?.done||false};let i=tasks.findIndex(x=>x.id===id);if(i>=0)tasks[i]=t;else tasks.push(t);$('#taskDlg').close();saveTasks()};
$('#taskCancel').onclick=()=>$('#taskDlg').close();$('#taskDel').onclick=()=>{let id=$('#taskId').value;if(confirm('Diesen Eintrag wirklich löschen?')){tasks=tasks.filter(t=>t.id!==id);$('#taskDlg').close();saveTasks()}};
document.addEventListener('click',e=>{let ck=e.target.closest('[data-check]');if(ck){let t=tasks.find(x=>x.id===ck.dataset.check);if(t){t.done=!t.done;saveTasks()}return}let ed=e.target.closest('[data-edit]');if(ed){let t=tasks.find(x=>x.id===ed.dataset.edit);if(t)openTask(t);return}let go=e.target.closest('[data-go]');if(go)switchView(go.dataset.go)});
function switchView(v){currentView=v;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('#'+v+'View').classList.add('active');document.querySelectorAll('.navBtn').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('#viewSub').textContent=v==='today'?'Alles Wichtige auf einen Blick.':v==='tasks'?'Deadlines, Prüfungen und Hausaufgaben.':'Deine Woche auf einen Blick.';$('#exportBtn').style.display=v==='schedule'?'block':'none';$('#add').title=v==='schedule'?'Kurs hinzufügen':'Deadline hinzufügen'}
document.querySelectorAll('.navBtn').forEach(b=>b.onclick=()=>switchView(b.dataset.view));document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{taskFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderPlanner()});

render();renderPlanner();switchView('today');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
